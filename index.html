<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>クイズで学ぶ Claude ｜ 安西工業 × NovaEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F1EA;--card:#FBFAF6;--ink:#1B2A4A;--sub:#5C6478;--line:rgba(27,42,74,.14);--blue:#2B59E8;--teal:#00937F;--sky:#C9DBF4;--red:#C8452F;
  --sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;--latin:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;min-height:100vh;min-height:100dvh;word-break:auto-phrase}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.logos{display:flex;align-items:center;gap:8px;flex:none}
.logos img.a{height:16px}.logos img.n{height:18px}.logos i{font-style:normal;color:var(--sub);font-size:11px}
.me{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;min-width:0}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#B9BFCB;flex:none}.dot.on{background:var(--teal)}
.kick{font-family:var(--latin);font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--sub);text-transform:uppercase;margin-top:26px}
h1{font-weight:900;font-size:28px;line-height:1.35;margin-top:8px;letter-spacing:.01em}
.lead{font-size:15px;line-height:1.75;color:var(--sub);margin-top:10px}
.lbl{font-size:13px;font-weight:700;color:var(--ink);margin:24px 0 10px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 14px 16px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.tbtn b{display:flex;align-items:center;gap:8px;font-size:15px;font-family:var(--latin);font-weight:600}
.tbtn b i{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:14px}
.tbtn span{display:block;font-size:13px;color:var(--sub);margin-top:8px;line-height:1.5}
.tbtn.on{border-color:var(--tc);box-shadow:inset 0 0 0 2px var(--tc)}
.tbtn:last-child:nth-child(odd){grid-column:1/-1}
.mems{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px 18px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.mbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;margin-top:10px}
input:focus{border-color:var(--blue)}
.btn{display:block;width:100%;margin-top:22px;padding:17px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.btn:disabled{opacity:.35}
#sub{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));box-shadow:0 0 0 10px var(--paper)}
.lv{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--lc)}
.lv .d{display:inline-flex;gap:3px}.lv .d i{width:7px;height:7px;border-radius:50%;background:var(--line)}.lv .d i.f{background:var(--lc)}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.qno{font-family:var(--latin);font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.14em}
.q{font-size:20px;font-weight:700;line-height:1.6;margin-top:12px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:16px;line-height:1.55;color:var(--ink);cursor:pointer}
.opt .n{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600;font-family:var(--latin)}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}.opt.sel .n{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--teal);background:#E3F2EE}.opt.ok .n{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ng{opacity:.45}.opt:disabled{cursor:default}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.tleft{font-size:12px;color:var(--sub);margin-top:6px;font-family:var(--latin)}
.msg{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.7;color:var(--sub)}
.msg.ok{border-color:rgba(0,147,127,.35);color:#0b6b5c}
.res{margin-top:20px;padding:18px;border-radius:14px;background:var(--ink);color:#fff}
.res .r{font-weight:900;font-size:22px}
.res p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.85);margin-top:10px}
.res .pt{margin-top:12px;font-size:13px;color:#9FD8CC;font-weight:700}
.score{display:flex;gap:10px;margin-top:16px}
.score div{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.score span{display:block;font-size:11px;color:var(--sub)}
.score b{font-family:var(--latin);font-weight:300;font-size:30px}
.wait{text-align:center;padding:44px 0 18px}
.wait .ring{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);margin:0 auto 18px;animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:30px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer;margin-top:10px}
.rh{display:inline-block;margin-top:14px;font-size:11px;font-weight:700;color:#fff;background:#D49A2A;padding:3px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logos"><img class="a" src="anzai.svg" alt="安西工業株式会社"><i>×</i><img class="n" src="nova.png" alt="NovaEdge"></div>
    <div class="me"><span class="dot" id="dot"></span><span id="mel">接続中…</span></div>
  </header>
  <main id="app"></main>
  <div class="foot">Claude Code 勉強会 ｜ 2026.10.13<br>送信するのは、チーム・名前・選んだ番号だけです</div>
</div>
<script src="mqtt.min.js"></script>
<script src="sync.js"></script>
<script src="quiz.js"></script>
<script>
const TP=(new URLSearchParams(location.search).get('t'))||TOPIC;
const REHEARSAL=TP!==TOPIC;
const LV={'前提':{c:'#7A8091',n:0},'初級':{c:'#00937F',n:1},'中級':{c:'#2B59E8',n:2},'上級':{c:'#1B2A4A',n:3}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escB=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,'<$1b>');
const KEY='anzai-quiz2-player-'+TP;
let S={pid:null,team:null,name:'',sid:null,ans:{},hist:{}};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(S,v)}catch(e){}
if(!S.pid)S.pid=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
S.hist=S.hist||{};S.ans=S.ans||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
let C=null, NET={}, selT=null, selN=null, sending=false, tick=null, pick=null, lastSent=0;

function snapshot(){return {v:2,sid:S.sid,pid:S.pid,team:S.team,name:S.name,ans:S.ans,ts:Date.now()}}
async function push(kind){
  if(!S.team||!S.sid)return false;
  const mode=kind==='sync'?'never':(C&&C.hostMqtt===false?'force':'fallback');
  const ok=await sync.publishPlayer(snapshot(),mode);
  if(ok)lastSent=Date.now();
  return ok;
}
function teamOf(id){return TEAMS.find(t=>t.id===id)}
function myScore(){if(!C||!C.ra)return 0;let s=0;Object.entries(C.ra).forEach(([q,a])=>{if(S.ans[q]===a&&QUIZ[q-1])s+=QUIZ[q-1].pts});return s}
function lvTag(q){const L=LV[q.level];return `<span class="lv" style="--lc:${L.c}">${q.level}${L.n?`<span class="d">${[1,2,3].map(k=>`<i class="${k<=L.n?'f':''}"></i>`).join('')}</span>`:''}${q.pts}pt</span>`}
function netOK(){return Object.values(NET).some(v=>v==='live')}

function render(){
  const t=S.team&&teamOf(S.team);
  $('#mel').textContent=t?`TEAM ${t.id}・${S.name}`:(netOK()?'接続OK':'接続中…');
  $('#dot').className='dot'+(netOK()?' on':'');
  if(!t)return renderJoin();
  if(!C||C.phase==='lobby'||C.sid!==S.sid)return renderWait('まもなくクイズが始まります','前の画面に問題が出ると、ここにも表示されます。');
  if(C.phase==='end')return renderEnd();
  const q=QUIZ[C.q-1];if(!q)return renderWait('準備中です','');
  if(C.phase==='open')return renderQ(q,C.q);
  if(C.phase==='reveal')return renderReveal(q,C.q);
  renderWait('準備中です','');
}
function renderJoin(){
  const t=selT&&teamOf(selT);
  $('#app').innerHTML=`<div class="kick">Claude Quiz — Join</div><h1>クイズで学ぶ Claude</h1>
  <p class="lead">チームと名前を選んで参加してください。全${QUIZ.length}問、前提・初級・中級・上級の4段階です。</p>${REHEARSAL?'<span class="rh">リハーサル用</span>':''}
  <div class="lbl">1. チーム</div><div class="teams">${TEAMS.map(x=>`<button class="tbtn${selT===x.id?' on':''}" style="--tc:${x.c}" data-t="${x.id}"><b><i>${x.id}</i>TEAM ${x.id}</b><span>${x.m.join('・')}</span></button>`).join('')}</div>
  ${t?`<div class="lbl">2. あなたの名前</div><div class="mems">${t.m.map(m=>`<button class="mbtn${selN===m?' on':''}" data-n="${esc(m)}">${esc(m)}</button>`).join('')}<button class="mbtn${selN==='__other'?' on':''}" data-n="__other">その他</button></div>
  ${selN==='__other'?`<input id="nm" maxlength="10" placeholder="名前を入力" value="">`:''}`:''}
  <button class="btn" id="go" ${t&&selN?'':'disabled'}>参加する</button>`;
  document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{selT=b.dataset.t;selN=null;renderJoin()});
  document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{selN=b.dataset.n;renderJoin();const i=$('#nm');if(i)i.focus()});
  $('#go').onclick=()=>{const nm=selN==='__other'?(($('#nm')||{}).value||'').trim().slice(0,10):selN;if(!nm){alert('名前を入力してください');return}
    S.team=selT;S.name=nm;save();push('join');render()};
}
function renderWait(h,p){
  clearInterval(tick);
  $('#app').innerHTML=`<div class="wait"><div class="ring"></div><h1 style="font-size:22px">${h}</h1><p class="lead">${p}</p></div>
  <div class="score"><div><span>あなたの得点</span><b>${myScore()}</b></div><div><span>チーム</span><b style="font-size:24px">TEAM ${S.team}</b></div></div>
  <div style="text-align:center"><button class="link" id="chg">チーム・名前を変更する</button></div>`;
  $('#chg').onclick=()=>{if(confirm('チームと名前を選び直しますか？')){selT=S.team;selN=null;S.team=null;save();render()}};
}
function deadline(){return C.openAt+C.dur*1000+1500}
function renderQ(q,n){
  const done=S.ans[n]!=null, closed=Date.now()>deadline();
  if(!done&&pick&&pick.n!==n)pick=null;
  const sel=done?S.ans[n]:(pick?pick.a:null);
  $('#app').innerHTML=`<div class="qmeta"><span class="qno">Q${String(n).padStart(2,'0')} / ${QUIZ.length}</span>${lvTag(q)}</div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt${sel===k+1?' sel':''}" data-a="${k+1}" ${done||closed?'disabled':''}><span class="n">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="bar"><i id="tb"></i></div><div class="tleft" id="tl"></div>
  ${done?`<div class="msg ok">送信しました。正解の発表を待っています。</div>`:closed?`<div class="msg">締め切りました。正解の発表を待っています。</div>`:`<button class="btn" id="sub" ${sel?'':'disabled'}>${sel?sel+' 番で送信する':'番号を選んでください'}</button>`}`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick={n,a:+b.dataset.a};renderQ(q,n)});
  const sb=$('#sub');if(sb)sb.onclick=async()=>{
    if(sending||!pick)return;sending=true;sb.disabled=true;sb.textContent='送信中…';
    S.ans[n]=pick.a;save();const ok=await push('answer');sending=false;
    if(ok){renderQ(q,n)}else{delete S.ans[n];save();sb.disabled=false;sb.textContent='送信できませんでした。もう一度押す'}
  };
  clearInterval(tick);const tot=C.dur*1000;
  const up=()=>{const r=Math.max(0,C.openAt+tot-Date.now());const tb=$('#tb'),tl=$('#tl');if(!tb)return;tb.style.width=(100*r/tot)+'%';tl.textContent=r>0?`残り ${Math.ceil(r/1000)} 秒`:'締め切り';
    if(Date.now()>deadline()){clearInterval(tick);if(S.ans[n]==null&&$('#sub'))renderQ(q,n)}};
  up();tick=setInterval(up,250);
}
function renderReveal(q,n){
  clearInterval(tick);const A=C.ra&&C.ra[n];const R=C.rev||{};
  const my=S.ans[n],ok=my===A;
  $('#app').innerHTML=`<div class="qmeta"><span class="qno">Q${String(n).padStart(2,'0')} / ${QUIZ.length}</span>${lvTag(q)}</div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt ${k+1===A?'ok':(my===k+1?'sel ng':'ng')}" disabled><span class="n">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="res"><div class="r">${my==null?'未回答':ok?'正解！ +'+q.pts+'pt':'残念…'}</div><p>${escB(R.e)}</p><div class="pt">POINT ｜ ${esc(R.p)}</div></div>
  <div class="score"><div><span>あなたの得点</span><b>${myScore()}</b></div><div><span>チーム</span><b style="font-size:24px">TEAM ${S.team}</b></div></div>`;
}
function renderEnd(){
  clearInterval(tick);
  $('#app').innerHTML=`<div class="kick">Finished</div><h1>おつかれさまでした</h1><p class="lead">結果は前の画面で発表します。</p>
  <div class="score"><div><span>あなたの得点</span><b>${myScore()}</b></div><div><span>チーム</span><b style="font-size:24px">TEAM ${S.team}</b></div></div>`;
}
function validCtl(m){return m&&typeof m.sid==='string'&&typeof m.ts==='number'&&['lobby','open','reveal','end'].includes(m.phase)&&(m.phase==='lobby'||m.phase==='end'||(Number.isInteger(m.q)&&m.q>=1&&m.q<=QUIZ.length))}
function onCtl(m){
  if(!validCtl(m))return;
  if(C&&m.ts<=C.ts)return;
  if(S.sid!==m.sid){
    if(S.sid)S.hist[S.sid]=S.ans;
    S.sid=m.sid;S.ans=S.hist[m.sid]||{};
    const ks=Object.keys(S.hist);if(ks.length>6)delete S.hist[ks[0]];
    save();
  }
  const prev=C;C=m;
  const newSid=!prev||prev.sid!==m.sid;
  if(newSid||prev.phase!==m.phase||prev.q!==m.q){render();push(newSid&&S.team?'join':'sync')}
}
const sync=QSync.create({topic:TP,role:'player',onCtl,onStatus:s=>{NET=s;const d=$('#dot');if(d)d.className='dot'+(netOK()?' on':'');if(!S.team)render()},onReconnect:()=>push('sync')});
render();sync.start();
setInterval(()=>{if(S.team&&S.sid&&Date.now()-lastSent>45000)push('sync')},15000);
</script>
</body>
</html>
